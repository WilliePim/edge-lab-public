[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data"
version = "0.1.0"
description = "Archivio locale dei prezzi (EOD Historical Data) e unico punto di accesso per gli altri package"
readme = "README.md"
requires-python = ">=3.11"
# Fasi 0-2: solo libreria standard. duckdb e pyarrow servono dalla fase 3 (tabelle Parquet e viste DuckDB),
# chiesti dalla direttiva dell'utente; si installano allora (docs/adr/001-struttura.md).
dependencies = []

[project.optional-dependencies]
# exchange_calendars: calendario delle sedute (quality/calendario.py), versione usata in fase 1: 4.13.2 (docs/adr/005).
archivio = ["duckdb>=1.0", "pyarrow>=15", "pandas>=2.0", "exchange_calendars>=4.13"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["market_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
